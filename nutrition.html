<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영양제 최적화 MVP</title>
  <link rel="stylesheet" href="nutrition.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>건강검진 기반 영양제 최적화</h1>
      <p>현재 복용 영양제와 건강검진 수치를 바탕으로 권장량 대비 섭취 상태를 분석합니다.</p>
    </header>

    <section class="card">
      <h2>1) 현재 복용 영양제 입력</h2>
      <label for="supplement-names">영양제 이름 (줄바꿈 또는 쉼표 구분)</label>
      <textarea id="supplement-names" rows="4" placeholder="예) 센트룸 우먼, 오메가3 1000, 비타민D 2000IU"></textarea>

      <label for="label-text">라벨 텍스트(OCR 결과 붙여넣기 또는 직접 입력)</label>
      <textarea id="label-text" rows="5" placeholder="예) Vitamin D 2000 IU, Magnesium 250 mg, Zinc 8 mg"></textarea>
      <p class="hint">MVP에서는 이미지 업로드 대신 OCR 텍스트 입력 방식으로 동작합니다.</p>
    </section>

    <section class="card">
      <h2>2) 건강검진 수치 입력</h2>
      <div class="grid">
        <label>비타민D (ng/mL)
          <input id="lab-vitamin-d" type="number" step="0.1" placeholder="예: 18">
        </label>
        <label>LDL 콜레스테롤 (mg/dL)
          <input id="lab-ldl" type="number" step="1" placeholder="예: 165">
        </label>
        <label>HbA1c (%)
          <input id="lab-hba1c" type="number" step="0.1" placeholder="예: 6.1">
        </label>
        <label>페리틴 (ng/mL)
          <input id="lab-ferritin" type="number" step="0.1" placeholder="예: 20">
        </label>
      </div>
      <button id="analyze-btn" type="button">분석하기</button>
    </section>

    <section class="card" id="result-section" hidden>
      <h2>3) 분석 결과</h2>
      <div id="summary" class="summary"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>성분</th>
              <th>현재 섭취량</th>
              <th>권장량</th>
              <th>상한섭취량</th>
              <th>상태</th>
              <th>추천</th>
              <th>근거</th>
            </tr>
          </thead>
          <tbody id="result-body"></tbody>
        </table>
      </div>
      <p class="disclaimer">의료 진단/처방이 아닌 참고용 분석입니다. 질환 치료 및 복약 관련 의사결정은 의료진과 상담하세요.</p>
    </section>
  </main>

  <script src="nutrition.js"></script>
</body>
</html>
